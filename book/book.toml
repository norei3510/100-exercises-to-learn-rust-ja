[book]
authors = ["Luca Palmieri"]
language = "ja"
src = "src"
title = "Rustを学ぶための100の演習問題（日本語版）"
description = "演習を一つずつ解きながらRustを学ぶ、非公式AI日本語翻訳版。"

[preprocessor.exercise-linker]
command = "python ../helpers/mdbook_exercise_linker.py"
renderers = ["html"]
exercise_root_url = "https://github.com/norei3510/100-exercises-to-learn-rust-ja/tree/main/exercises"

[output.html]
site-url = "/100-exercises-to-learn-rust-ja/"
git-repository-url = "https://github.com/norei3510/100-exercises-to-learn-rust-ja"
additional-js = ["theme/japanese-search.js"]

[output.html.playground]
runnable = false
